<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Product</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!-- Topbar -->
    <div
      class="topbar d-flex justify-content-between align-items-center p-2 bg-light border-bottom"
    >
      <div class="d-flex align-items-center gap-2">
        <!-- Offcanvas toggle button -->
        <button
          class="btn d-md-none"
          type="button"
          data-bs-toggle="offcanvas"
          data-bs-target="#offcanvasSidebar"
          aria-controls="offcanvasSidebar"
        >
          <i class="fa fa-bars"></i>
        </button>
        <div class="topbar-logo">
          <img src="./assets/logo.png" alt="Logo" height="36" />
        </div>
      </div>
      <div class="avatar">
        <img style="width: 36px" src="./assets/profile.png" alt="Avatar" />
      </div>
    </div>

    <!-- Layout -->
    <div class="layout d-flex flex-column flex-md-row">
      <!-- Sidebar -->
       <!-- Sidebar for mobile (offcanvas) and desktop -->

      <div
        class="offcanvas offcanvas-start d-md-none"
        tabindex="-1"
        id="offcanvasSidebar"
        aria-labelledby="offcanvasSidebarLabel"
      >
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="offcanvasSidebarLabel">Menu</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="offcanvas"
            aria-label="Close"
          ></button>
        </div>
        <div class="offcanvas-body px-0">
          <!-- Sidebar content -->

          <ul class="nav flex-column px-2">
            <li>
              <a href="./index.html" class="nav-link"
                ><i class="fa fa-user"></i> Users</a
              >
            </li>
            <!-- (repeat your menu items here) -->

            <li>
              <a
                class="nav-link d-flex justify-content-between align-items-center"
                data-bs-toggle="collapse"
                href="#productsMenu"
                role="button"
                aria-expanded="false"
                aria-controls="productsMenu"
              >
                <span><i class="fa fa-box"></i> Products</span>
                <i class="fa fa-chevron-down small"></i>
              </a>
              <div class="collapse ps-3" id="productsMenu">
                <ul class="nav flex-column">
                  <li>
                    <a href="./addProduct.html" class="nav-link active"
                      ><i class="fa fa-plus"></i> Add Product</a
                    >
                  </li>
                  <li>
                    <a href="./allProducts.html" class="nav-link"
                      ><i class="fa fa-list"></i> All Products</a
                    >
                  </li>
                </ul>
              </div>
            </li>

            <li>
              <a href="./allTasks.html" class="nav-link"
                ><i class="fa fa-tasks"></i> Tasks</a
              >
            </li>
            <li>
              <a href="./contacts.html" class="nav-link"
                ><i class="fa fa-trophy"></i> Contacts</a
              >
            </li>
            <li>
              <a href="./affiliate.html" class="nav-link"
                ><i class="fa fa-link"></i> Affiliate</a
              >
            </li>
            <li>
              <a href="./vipLevels.html" class="nav-link"
                ><i class="fa fa-star"></i> VIP Levels</a
              >
            </li>
            <li>
              <a href="./payment.html" class="nav-link"
                ><i class="fa fa-credit-card"></i> Payment</a
              >
            </li>
            <li></li>
            <li>
              <a href="./setting.html" class="nav-link"
                ><i class="fa fa-cog"></i> Settings</a
              >
            </li>
          </ul>
        </div>
      </div>

      <!-- Sidebar for desktop -->
      <div class="sidebar d-none d-md-block bg-white border-end">
        <div class="search-box">
          <input type="text" placeholder="Search here..." />
          <i class="fa fa-search text-dark"></i>
        </div>
        <ul class="nav flex-column px-2">
          <li>
            <a href="./index.html" class="nav-link"
              ><i class="fa fa-user"></i> Users</a
            >
          </li>

          <li>
            <a
              class="nav-link d-flex justify-content-between align-items-center"
              data-bs-toggle="collapse"
              href="#productsMenu"
              role="button"
              aria-expanded="false"
              aria-controls="productsMenu"
            >
              <span><i class="fa fa-box"></i> Products</span>
              <i class="fa fa-chevron-down small"></i>
            </a>
            <div class="collapse ps-3" id="productsMenu">
              <ul class="nav flex-column">
                <li>
                  <a href="./addProduct.html" class="nav-link active"
                    ><i class="fa fa-plus"></i> Add Product</a
                  >
                </li>
                <li>
                  <a href="./allProducts.html" class="nav-link"
                    ><i class="fa fa-list"></i> All Products</a
                  >
                </li>
              </ul>
            </div>
          </li>

          <li>
            <a href="./allTasks.html" class="nav-link"
              ><i class="fa fa-tasks"></i> Tasks</a
            >
          </li>
          <li>
            <a href="./contacts.html" class="nav-link"
              ><i class="fa fa-trophy"></i> Contacts</a
            >
          </li>
          <li>
            <a href="./affiliate.html" class="nav-link"
              ><i class="fa fa-link"></i> Affiliate</a
            >
          </li>
          <li>
            <a href="./vipLevels.html" class="nav-link"
              ><i class="fa fa-star"></i> VIP Levels</a
            >
          </li>
          <li>
            <a href="./payment.html" class="nav-link"
              ><i class="fa fa-credit-card"></i> Payment</a
            >
          </li>
          <li></li>
          <li>
            <a href="./setting.html" class="nav-link"
              ><i class="fa fa-cog"></i> Settings</a
            >
          </li>
        </ul>
      </div>
      <div class="main-content flex-fill px-3 py-3">
        <div class="container my-4">
          <div class="card p-4">
            <h5 class="fw-bold mb-3">Add Products</h5>
            <hr />

            <form>
              <!-- Image Upload -->
              <div class="mb-4">
                <label
                  for="productImage"
                  class="d-inline-block p-3 border rounded"
                  style="cursor: pointer"
                >
                  <img src="./assets/upload.png" alt="Upload Icon" width="80" />
                </label>
                <input type="file" id="productImage" hidden />
              </div>

              <!-- Title -->
              <div class="mb-3">
                <label
                  for="productTitle"
                  class="form-label"
                  style="font-weight: 500"
                  >Title</label
                >
                <input type="text" class="form-control" id="productTitle" />
              </div>

              <!-- Price -->
              <div class="mb-3">
                <label
                  for="productPrice"
                  class="form-label"
                  style="font-weight: 500"
                  >Price</label
                >
                <input type="text" class="form-control" id="productPrice" />
              </div>

              <!-- Submit Button -->
              <div class="text-center">
                <button
                  type="submit"
                  class="btn px-5 text-white fw-bold"
                  style="background-color: #6900d1"
                >
                  Submit
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
